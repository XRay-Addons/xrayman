Traffic:
  type: object
  properties:
    Total:
      $ref: "#/TrafficStats"
    RecentDays:
      $ref: "#/TrafficStats"
  required:
    - Total
    - RecentDays

TrafficStats:
  type: object
  properties:
    Upload:
      type: integer
      format: int64
    Download:
      type: integer
      format: int64
  required:
    - Upload
    - Download
