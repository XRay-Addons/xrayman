NodeID:
  type: integer

Endpoint:
  type: string
  maxLength: 256

NodeStatus:
  type: string
  enum: [unknown, stopped, running]

AccessKey:
  type: string
  minLength: 88
  maxLength: 88
  description: Base64-encoded 32-byte access secret + 32-byte cert hash

NodeConnectionInfo:
  type: object
  properties:
    Endpoint:
      $ref: "#/Endpoint"
    AccessKey:
      type: string
  required:
    - Endpoint
    - AccessKey

NodeSettings:
  type: object
  properties:
    ClientConfigTemplate:
      $ref: "./configs.yaml#/ClientConfigTemplate"
    Version:
      type: string
  required:
    - ClientConfigTemplate
    - Version

NodeConfig:
  type: object
  properties:
    Settings:
      $ref: "#/NodeSettings"
    ConnectionInfo:
      $ref: "#/NodeConnectionInfo"
  required:
    - Settings
    - ConnectionInfo

Node:
  type: object
  properties:
    ID:
      $ref: "#/NodeID"
    Config:
      $ref: "#/NodeConfig"
    CurrentStatus:
      $ref: "#/NodeStatus"
    TargetStatus:
      $ref: "#/NodeStatus"
  required:
    - ID
    - Config
    - CurrentStatus
    - TargetStatus

Performance:
  type: object
  description: Node performance
  required:
    - CpuLoad
    - RamLoad
    - MemLoad
    - OpenConnections
  properties:
    CpuLoad:
      type: number
      format: float
    RamLoad:
      type: number
      format: float
    MemLoad:
      type: number
      format: float
    OpenConnections:
      type: integer
      format: int32

NodeView:
  type: object
  properties:
    Node:
      $ref: "#/Node"
    Traffic:
      $ref: "./traffic.yaml#/Traffic"
    Performance:
      $ref: "#/Performance"
  required:
    - Node
    - Traffic
    - Performance
