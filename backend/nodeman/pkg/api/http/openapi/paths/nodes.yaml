NewNode:
  post:
    summary: Create a new node
    operationId: NewNode
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/requests/nodes.yaml#/NewNodeRequest"
    responses:
      "200":
        description: Created node
        content:
          application/json:
            schema:
              $ref: "../components/requests/nodes.yaml#/NewNodeResponse"
      "default":
        $ref: "../components/requests/error.yaml#/Error"

    tags:
      - admpage
    security:
      - BearerAuth: []

