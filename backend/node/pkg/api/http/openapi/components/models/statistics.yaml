UserStat:
  type: object
  description: User data usage statistics
  required:
    - ID
    - Uplink
    - Downlink
  properties:
    ID:
      $ref: "./user.yaml#/UserID"
    Uplink:
      type: integer
      format: int64
    Downlink:
      type: integer
      format: int64

Performance:
  type: object
  description: Node performance
  required:
    - CpuLoad
    - RamLoad
    - MemLoad
    - OpenConnections
  properties:
    CpuLoad:
      type: number
      format: float
    RamLoad:
      type: number
      format: float
    MemLoad:
      type: number
      format: float
    OpenConnections:
      type: integer
      format: int32
