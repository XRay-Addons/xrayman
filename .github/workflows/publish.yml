name: Publish XRayMan

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache-dependency-path: |
            backend/node/go.sum
            backend/nodeman/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.3.0
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build Project
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          make build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      # Готовим структуру папок для сборки .deb
      - name: Prepare DEB Structure
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p ./deb-root/usr/bin
          mkdir -p ./deb-root/lib/systemd/system
          cp ./build/xray-nodeman/xray-nodeman ./deb-root/usr/bin/xrayman-nodeman
          cp ./scripts/xrayman-nodeman.service ./deb-root/lib/systemd/system/xrayman-nodeman.service
          # Заодно очищаем префикс 'v' из версии для deb-пакета
          echo "CLEAN_VER=$(echo '${{ github.ref_name }}' | sed 's/^v//')" >> $GITHUB_ENV

      - name: Pack DEB Package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: jasononeil/create-debian-package@v3
        with:
          directory: ./deb-root
          package_name: xrayman-nodeman
          version: ${{ env.CLEAN_VER }}
          arch: ${{ matrix.goarch }}
          maintainer: "XRay-Addons Team <admin@example.com>"
          description: "XRayMan Node Manager Service"
          postinst: scripts/postinstall.sh
          prerm: scripts/prerm.sh

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.goarch }} .
          docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.goarch }}
