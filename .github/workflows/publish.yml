name: Publish XRayMan

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    permissions:
      contents: write
      packages: write # Нужно для публикации Docker-образов в ghcr.io

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache-dependency-path: |
            backend/node/go.sum
            backend/nodeman/go.sum

      - name: Install Go Tools
        run: |
          # install go tools via make, add to path
          make tools
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.3.0
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build Project
        run: make build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      - name: Archive build artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build

          zip -r ../xrayman-node-${{ matrix.goos }}-${{ matrix.goarch }}.zip xray-node
          tar -czf ../xrayman-node-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz xray-node

          zip -r ../xrayman-nodeman-${{ matrix.goos }}-${{ matrix.goarch }}.zip xray-nodeman
          tar -czf ../xrayman-nodeman-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz xray-nodeman

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xrayman-node-${{ matrix.goos }}-${{ matrix.goarch }}.zip
            xrayman-node-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            xrayman-nodeman-${{ matrix.goos }}-${{ matrix.goarch }}.zip
            xrayman-nodeman-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # НАЧАЛО НОВЫХ ШАГОВ: СБОРКА .DEB И DOCKER
      - name: Pack DEB Package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          CLEAN_VER=$(echo '${{ github.ref_name }}' | sed 's/^v//')
          DIR="xray-nodeman_${CLEAN_VER}_${{ matrix.goarch }}"

          # 1. Создаем структуру папок внутри будущего пакета
          mkdir -p "$DIR/usr/bin"
          mkdir -p "$DIR/lib/systemd/system"
          mkdir -p "$DIR/DEBIAN"

          # 2. Копируем бинарник (из папки build/xray-nodeman), сервис и скрипты
          cp ./build/xray-nodeman/xray-nodeman "$DIR/usr/bin/xray-nodeman"
          cp ./packaging/xray-nodeman.service "$DIR/lib/systemd/system/xray-nodeman.service"
          cp ./packaging/xray-nodeman.postinstall.sh "$DIR/DEBIAN/postinst"
          cp ./packaging/xray-nodeman.prerm.sh "$DIR/DEBIAN/prerm"
          chmod +x "$DIR/DEBIAN/postinst" "$DIR/DEBIAN/prerm"

          # 3. Генерируем обязательный манифест пакета (control)
          cat << EOF > "$DIR/DEBIAN/control"
          Package: xray-nodeman
          Version: $CLEAN_VER
          Architecture: ${{ matrix.goarch }}
          Maintainer: XRay-Addons Team <admin@example.com>
          Description: XRayMan Node Manager Service
          Section: utils
          Priority: optional
          EOF

          # 4. Собираем дебиан-пакет стандартной утилитой Ubuntu
          dpkg-deb --build "$DIR"

      - name: Upload DEB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "xray-nodeman_*.deb"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.goarch }} .
          docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.goarch }}
