name: Publish XRayMan

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache-dependency-path: |
            backend/node/go.sum
            backend/nodeman/go.sum

      - name: Install Go Tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.3.0
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      # СБОРКА ОБЕИХ АРХИТЕКТУР ПО ОЧЕРЕДИ БЕЗ МАТРИЦЫ
      - name: Build Project
        run: |
          # Сборка amd64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 VERSION=${{ github.ref_name }} COMMIT=${{ github.sha }} BUILD_TIME=${{ github.event.head_commit.timestamp }} make build
          mkdir -p ./dist/amd64 && cp ./build/xray-nodeman/xray-nodeman ./dist/amd64/xray-nodeman

          # Сборка arm64 (Опечатка с двойным dist исправлена!)
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 VERSION=${{ github.ref_name }} COMMIT=${{ github.sha }} BUILD_TIME=${{ github.event.head_commit.timestamp }} make build
          mkdir -p ./dist/arm64 && cp ./build/xray-nodeman/xray-nodeman ./dist/arm64/xray-nodeman

      # СОБИРАЕМ ДВА .DEB ПАКЕТА ЗА ОДИН ПРОХОД
      - name: Pack DEB Packages
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          CLEAN_VER=$(echo '${{ github.ref_name }}' | sed 's/^v//')
          for ARCH in amd64 arm64; do
            DIR="xray-nodeman-${ARCH}"
            mkdir -p "$DIR/usr/bin" "$DIR/lib/systemd/system" "$DIR/etc/xray-nodeman" "$DIR/DEBIAN"
            cp ./dist/${ARCH}/xray-nodeman "$DIR/usr/bin/xray-nodeman"
            cp ./packaging/xray-nodeman/deb/xray-nodeman.service "$DIR/lib/systemd/system/xray-nodeman.service"
            cp ./packaging/xray-nodeman/deb/env.example "$DIR/etc/xray-nodeman/env.example"
            cp ./packaging/xray-nodeman/deb/postinstall.sh "$DIR/DEBIAN/postinst"
            cp ./packaging/xray-nodeman/deb/prerm.sh "$DIR/DEBIAN/prerm"
            cp ./packaging/xray-nodeman/deb/postrm.sh "$DIR/DEBIAN/postrm"
            chmod +x "$DIR/DEBIAN/postinst" "$DIR/DEBIAN/prerm" "$DIR/DEBIAN/postrm"
            sed -e "s/VERSION_PLACEHOLDER/$CLEAN_VER/" \
                -e "s/ARCH_PLACEHOLDER/$ARCH/" \
                ./packaging/xray-nodeman/deb/control.template > "$DIR/DEBIAN/control"
            dpkg-deb --build "$DIR"
          done

      # ГЕНЕРИРУЕМ АКТУАЛЬНЫЕ DOCKER COMPOSE ФАЙЛЫ
      - name: Prepare Docker Compose Manifests
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          CLEAN_VER=$(echo '${{ github.ref_name }}' | sed 's/^v//')

          # 1. Создаем целевые папки (без этого sed упадет с ошибкой)
          mkdir -p ./dist/all-in-one.docker
          mkdir -p ./dist/standalone.docker

          # 2. Заменяем плейсхолдер версии на реальный тег релиза
          sed "s/VERSION_PLACEHOLDER/$CLEAN_VER/g" ./packaging/xray-nodeman/docker/all-in-one.docker-compose.yml > ./dist/all-in-one.docker/docker-compose.yml
          sed "s/VERSION_PLACEHOLDER/$CLEAN_VER/g" ./packaging/xray-nodeman/docker/standalone.docker-compose.yml > ./dist/standalone.docker/docker-compose.yml

          # 3. (Опционально) Скопируйте сюда дополнительные файлы конфигурации, если они есть
          cp ./packaging/xray-nodeman/docker/all-in-one.datasource.yml ./dist/all-in-one.docker/datasource.yml
          # cp ./packaging/xray-nodeman/docker/prometheus.yml ./dist/all-in-one/
          # cp -r ./packaging/xray-nodeman/docker/config ./dist/all-in-one/

          # 4. Архиривуем папки (флаг -C временно меняет директорию, чтобы внутри архива не было лишней вложенности)
          tar -czf docker-compose.all-in-one.tar.gz -C ./dist/all-in-one.docker .
          tar -czf docker-compose.standalone.tar.gz -C ./dist/standalone.docker .

      # ПУБЛИКУЕМ ВСЕ АССЕТЫ В РЕЛИЗ (DEB + DOCKER COMPOSE)
      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            xray-nodeman-*.deb
            docker-compose.all-in-one.tar.gz
            docker-compose.standalone.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # СБОРКА ОДНОГО МУЛЬТИПЛАТФОРМЕННОГО ОБРАЗА СРАЗУ (БЕЗ ДУБЛИРОВАНИЯ)
      - name: Push Multi-Arch Docker Image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE_NAME=$(echo "${{ github.repository_owner }}/xray-nodeman" | tr '[:upper:]' '[:lower:]')
          CLEAN_VER=$(echo '${{ github.ref_name }}' | sed 's/^v//')

          # Включаем эмуляцию QEMU для сборки под ARM прямо на машине Intel
          docker run --privileged --rm tonistiigi/binfmt --install all
          docker buildx create --use

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f ./packaging/xray-nodeman/docker/xray-nodeman.dockerfile \
            -t ghcr.io/${IMAGE_NAME}:latest -t ghcr.io/${IMAGE_NAME}:${CLEAN_VER} \
            --push .
