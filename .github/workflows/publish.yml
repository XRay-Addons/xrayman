name: Publish XRayMan

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  # ==================================================================
  # Build
  # ==================================================================

  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache-dependency-path: |
            backend/node/go.sum
            backend/nodeman/go.sum

      - name: Install Go Tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.3.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # ------------------------------------------------------------
      # Build Project
      # ------------------------------------------------------------

      - name: Build Project
        run: make build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      # ------------------------------------------------------------
      # Archive binaries
      # ------------------------------------------------------------

      - name: Archive build artifacts
        run: |
          mkdir -p dist

          cd build

          zip -r "../dist/xrayman-node-${{ matrix.goos }}-${{ matrix.goarch }}.zip" xray-node
          tar -czf "../dist/xrayman-node-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" xray-node

          zip -r "../dist/xrayman-nodeman-${{ matrix.goos }}-${{ matrix.goarch }}.zip" xray-nodeman
          tar -czf "../dist/xrayman-nodeman-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" xray-nodeman

          cd ..

      # ------------------------------------------------------------
      # Install nfpm
      # ------------------------------------------------------------

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt update
          sudo apt install nfpm
          nfpm --version

      # ------------------------------------------------------------
      # Set package version
      # ------------------------------------------------------------

      - name: Set package version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            RELEASE="1"
          else
            VERSION="0.0.0"
            RELEASE="${{ github.ref_name }}"

            # Keep only letters, digits and hyphens.
            RELEASE=$(printf '%s' "$RELEASE" | sed 's/[^A-Za-z0-9-]\+/-/g')

            # Remove leading/trailing hyphens.
            RELEASE=$(printf '%s' "$RELEASE" | sed 's/^-*//; s/-*$//')

            # Fallback if nothing remains.
            [ -n "$RELEASE" ] || RELEASE="dev"
          fi

          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_RELEASE=$RELEASE" >> "$GITHUB_ENV"

          echo "Package version: $VERSION-$RELEASE"

      # ------------------------------------------------------------
      # Build DEB
      # ------------------------------------------------------------

      - name: Build DEB package
        run: |
          mkdir -p dist

          ARCH=${{ matrix.goarch }} \
          VERSION=${PACKAGE_VERSION} \
          RELEASE=${PACKAGE_RELEASE} \
          nfpm package \
            --config packaging/nfpm.yaml \
            --packager deb \
            --target "dist/xrayman-nodeman-${{ matrix.goarch }}.deb"

      # ------------------------------------------------------------
      # Build RPM
      # ------------------------------------------------------------

      - name: Build RPM package
        run: |
          mkdir -p dist

          ARCH=${{ matrix.goarch }} \
          VERSION=${PACKAGE_VERSION} \
          RELEASE=${PACKAGE_RELEASE} \
          nfpm package \
            --config packaging/nfpm.yaml \
            --packager rpm \
            --target "dist/xrayman-nodeman-${{ matrix.goarch }}.rpm"

      # ------------------------------------------------------------
      # Docker
      #
      # The Go binary was already built above.
      # Docker only packages the existing binary.
      # ------------------------------------------------------------

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Prepare Docker context
        run: |
          mkdir -p docker-context
          mkdir -p dist/docker-input

          cp build/xray-nodeman/xray-nodeman \
            "dist/docker-input/xray-nodeman-${{ matrix.goarch }}"

          cp build/xray-nodeman/xray-nodeman \
            "docker-context/xray-nodeman-${{ matrix.goarch }}"

          cp packaging/xray-nodeman.dockerfile docker-context/Dockerfile

      # ------------------------------------------------------------
      # Build architecture-specific Docker image
      #
      # This image is stored as a Docker archive and uploaded
      # together with the other architecture-specific artifacts.
      # ------------------------------------------------------------

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/${{ matrix.goarch }}
          outputs: type=docker,dest=dist/xrayman-nodeman-${{ matrix.goarch }}.docker.tar

      # ------------------------------------------------------------
      # Upload everything
      # ------------------------------------------------------------

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xrayman-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # ==================================================================
  # Docker multi-platform image
  # ==================================================================

  docker:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # ------------------------------------------------------------
      # Download architecture-specific build artifacts
      # ------------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xrayman-linux-*
          path: dist
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Docker context
        run: |
          mkdir -p docker-context

          cp dist/docker-input/xray-nodeman-amd64 \
            docker-context/xray-nodeman-amd64

          cp dist/docker-input/xray-nodeman-arm64 \
            docker-context/xray-nodeman-arm64

          cp packaging/xray-nodeman.dockerfile docker-context/Dockerfile

      # ------------------------------------------------------------
      # Tag: login to GHCR
      # ------------------------------------------------------------

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # Tag: build and push multi-arch image
      # ------------------------------------------------------------

      - name: Build and push multi-arch Docker image
        if: startsWith(github.ref, 'refs/tags/') && env.ACT != 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      # ------------------------------------------------------------
      # Build multi-arch OCI archive
      #
      # This is built from the already-compiled amd64/arm64 binaries.
      # No Go compilation happens here.
      # ------------------------------------------------------------

      - name: Build multi-arch OCI archive
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=dist/xrayman-nodeman.oci.tar

      # ------------------------------------------------------------
      # Compress OCI archive
      # ------------------------------------------------------------

      - name: Compress OCI archive
        run: |
          zstd -T0 -19 \
            dist/xrayman-nodeman.oci.tar \
            -o dist/xrayman-nodeman.oci.tar.zst

          rm dist/xrayman-nodeman.oci.tar

      # ------------------------------------------------------------
      # Upload multi-arch Docker artifact
      # ------------------------------------------------------------

      - name: Upload Docker artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xrayman-docker
          path: dist/xrayman-nodeman.oci.tar.zst

  # ==================================================================
  # GitHub Release
  # ==================================================================

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - docker
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ------------------------------------------------------------
      # Download architecture-specific build artifacts
      # ------------------------------------------------------------

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xrayman-linux-*
          path: dist
          merge-multiple: true

      # ------------------------------------------------------------
      # Download multi-arch Docker artifact
      # ------------------------------------------------------------

      - name: Download Docker artifacts
        uses: actions/download-artifact@v4
        with:
          name: xrayman-docker
          path: dist

      # ------------------------------------------------------------
      # Create GitHub Release
      # ------------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
