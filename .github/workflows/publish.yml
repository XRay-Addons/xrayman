name: Publish XRayMan

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache-dependency-path: |
            backend/node/go.sum
            backend/nodeman/go.sum

      - name: Install Go Tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.3.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build Project
        run: make build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      - name: Archive binaries
        run: |
          mkdir -p dist

          cd build

          zip -r "../dist/xrayman-node-${{ matrix.goos }}-${{ matrix.goarch }}.zip" xray-node
          tar -czf "../dist/xrayman-node-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" xray-node

          zip -r "../dist/xrayman-nodeman-${{ matrix.goos }}-${{ matrix.goarch }}.zip" xray-nodeman
          tar -czf "../dist/xrayman-nodeman-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" xray-nodeman

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt update
          sudo apt install nfpm

      - name: Set package version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            RELEASE="1"
          else
            VERSION="0.0.0"
            RELEASE="${{ github.ref_name }}"
            RELEASE=$(printf '%s' "$RELEASE" | sed 's/[^A-Za-z0-9-]\+/-/g')
            RELEASE=$(printf '%s' "$RELEASE" | sed 's/^-*//; s/-*$//')
            [ -n "$RELEASE" ] || RELEASE="dev"
          fi

          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_RELEASE=$RELEASE" >> "$GITHUB_ENV"

      - name: Build DEB
        run: |
          ARCH=${{ matrix.goarch }} \
          VERSION=${PACKAGE_VERSION} \
          RELEASE=${PACKAGE_RELEASE} \
          nfpm package \
            --config packaging/nfpm.yaml \
            --packager deb \
            --target "dist/xrayman-nodeman-${{ matrix.goarch }}.deb"

      - name: Build RPM
        run: |
          ARCH=${{ matrix.goarch }} \
          VERSION=${PACKAGE_VERSION} \
          RELEASE=${PACKAGE_RELEASE} \
          nfpm package \
            --config packaging/nfpm.yaml \
            --packager rpm \
            --target "dist/xrayman-nodeman-${{ matrix.goarch }}.rpm"

      # Keep the already-built binaries for the Docker job.
      - name: Prepare Docker input
        run: |
          mkdir -p dist/docker-input

          cp build/xray-nodeman/xray-nodeman \
            "dist/docker-input/xray-nodeman-${{ matrix.goarch }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xrayman-${{ matrix.goarch }}
          path: dist/

  docker:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xrayman-*
          path: dist
          merge-multiple: true

      - name: Prepare Docker context
        run: |
          mkdir docker-context

          cp dist/docker-input/xray-nodeman-amd64 \
            docker-context/xray-nodeman-amd64

          cp dist/docker-input/xray-nodeman-arm64 \
            docker-context/xray-nodeman-arm64

          cp packaging/xray-nodeman.dockerfile \
            docker-context/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest

      - name: Build OCI archive
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=dist/xrayman-nodeman.oci.tar

      - name: Compress OCI archive
        run: zstd -T0 -19 dist/xrayman-nodeman.oci.tar -o dist/xrayman-nodeman.oci.tar.zst

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: xrayman-docker
          path: dist/xrayman-nodeman.oci.tar.zst

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, docker]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xrayman-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
