name: Publish XRayMan

on:
  push:
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux; goarch: amd64; debarch: amd64
          - goos: linux; goarch: arm64; debarch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Environment (Go, Node, pnpm)
        uses: actions/setup-go@v6
        with: { go-version: "1.26.2", cache-dependency-path: "backend/node/go.sum\nbackend/nodeman/go.sum" }
      - uses: pnpm/action-setup@v5
        with: { version: 10.33.2 }
      - uses: actions/setup-node@v5
        with: { node-version: 24.3.0, cache: "pnpm", cache-dependency-path: frontend/pnpm-lock.yaml }

      - name: Build Project
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          make build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      # ВСЕГО ОДИН ШАГ ДЛЯ СБОРКИ ПОЛНОЦЕННОГО .DEB С SYSTEMD
      - name: Pack DEB Package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: jasononeil/create-debian-package@v3
        with:
          directory: ./build
          package_name: xrayman-nodeman
          version: ${{ sed 's/^v//' <<< github.ref_name }}
          arch: ${{ matrix.debarch }}
          maintainer: "XRay-Addons Team <admin@example.com>"
          description: "XRayMan Node Manager Service"
          postinst: packaging/xray-nodeman.postinstall.sh
          prerm: packaging/xray-nodeman.prerm.sh

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: "*.deb" }
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }

      # ВСЕГО ДВЕ КОМАНДЫ ДЛЯ ОТПРАВКИ DOCKER-ОБРАЗА В GHCR
      - name: Push Docker Image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.debarch }} .
          docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.debarch }}
