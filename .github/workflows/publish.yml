name: Publish XRayMan

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache-dependency-path: |
            backend/node/go.sum
            backend/nodeman/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.3.0
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build Project
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          make build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      # НАТИВНАЯ СБОРКА .DEB ИЗ СТАНДАРТНЫХ КОМАНД LINUX
      - name: Pack DEB Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CLEAN_VER=$(echo '${{ github.ref_name }}' | sed 's/^v//')
          DIR="xrayman-nodeman_${CLEAN_VER}_${{ matrix.goarch }}"

          # 1. Создаем структуру папок внутри будущего пакета
          mkdir -p "$DIR/usr/bin"
          mkdir -p "$DIR/lib/systemd/system"
          mkdir -p "$DIR/DEBIAN"

          # 2. Копируем бинарник, сервис и скрипты
          cp ./build/xray-nodeman/xray-nodeman "$DIR/usr/bin/xrayman-nodeman"
          cp ./packaging/xrayman-nodeman.service "$DIR/lib/systemd/system/xrayman-nodeman.service"
          cp ./packaging/postinstall.sh "$DIR/DEBIAN/postinst"
          cp ./packaging/prerm.sh "$DIR/DEBIAN/prerm"
          chmod +x "$DIR/DEBIAN/postinst" "$DIR/DEBIAN/prerm"

          # 3. Генерируем обязательный манифест пакета (control)
          cat << EOF > "$DIR/DEBIAN/control"
          Package: xrayman-nodeman
          Version: $CLEAN_VER
          Architecture: ${{ matrix.goarch }}
          Maintainer: XRay-Addons Team <admin@example.com>
          Description: XRayMan Node Manager Service
          Section: utils
          Priority: optional
          EOF

          # 4. Собираем дебиан-пакет стандартной утилитой Ubuntu
          dpkg-deb --build "$DIR"

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.goarch }} .
          docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.goarch }}
