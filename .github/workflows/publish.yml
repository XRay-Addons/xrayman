name: Publish XRayMan

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache-dependency-path: |
            backend/node/go.sum
            backend/nodeman/go.sum

      - name: Install Go Tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.3.0
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build Project
        run: make build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      # СОХРАНЯЕМ БИНАРНИК: Перекладываем его в уникальную папку под архитектуру
      - name: Prepare binary for upload
        run: |
          mkdir -p ./dist-binaries/${{ matrix.goarch }}
          cp ./build/xray-nodeman/xray-nodeman ./dist-binaries/${{ matrix.goarch }}/xray-nodeman

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-nodeman-${{ matrix.goarch }}
          path: ./dist-binaries/${{ matrix.goarch }}/xray-nodeman
          retention-days: 1

  # НОВАЯ ДЖОБА ДЛЯ NFPM, DOCKER И GITHUB RELEASE (Запускается только по тегам)
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Для GitHub Releases
      packages: write # Для отправки Docker-образов в GHCR

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Важно для генерации changelog в GoReleaser

      # СКАЧИВАЕМ ОБА БИНАРНИКА (amd64 и arm64)
      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: xray-nodeman-amd64
          path: ./dist-binaries/amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: xray-nodeman-arm64
          path: ./dist-binaries/arm64

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ЗАПУСКАЕМ GORELEASER
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
