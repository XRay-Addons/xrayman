# КОРОТКИЙ РАБОТАЮЩИЙ КОД СБОРКИ DEB И DOCKER
deploy:
  needs: build
  if: startsWith(github.ref, 'refs/tags/v')
  runs-on: ubuntu-latest
  permissions:
    contents: write
    packages: write

  steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Скачиваем собранные вами бинарники (архивы .tar.gz) из релиза
    - name: Download Build Artifacts
      uses: softprops/action-gh-release@v2
      with:
        file_regex: ".*\\.tar\\.gz"
        path: ./downloads
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 2. Собираем DEB-пакеты под обе архитектуры штатными командами Linux
    - name: Pack DEB Packages
      run: |
        CLEAN_VER=$(echo '${{ github.ref_name }}' | sed 's/^v//')

        for ARCH in amd64 arm64; do
          DIR="xray-nodeman_${CLEAN_VER}_${ARCH}"
          mkdir -p "$DIR/usr/bin" "$DIR/lib/systemd/system" "$DIR/DEBIAN"
          
          # Распаковываем ваш готовый бинарник
          tar -xzf ./downloads/xrayman-nodeman-linux-${ARCH}.tar.gz -C .
          cp ./xray-nodeman "$DIR/usr/bin/xray-nodeman"
          
          # Копируем ваши скрипты и сервис
          cp ./packaging/xray-nodeman.service "$DIR/lib/systemd/system/xray-nodeman.service"
          cp ./packaging/xray-nodeman.postinstall.sh "$DIR/DEBIAN/postinst"
          cp ./packaging/xray-nodeman.prerm.sh "$DIR/DEBIAN/prerm"
          chmod +x "$DIR/DEBIAN/postinst" "$DIR/DEBIAN/prerm"
          
          # Генерируем манифест и собираем
          echo -e "Package: xray-nodeman\nVersion: $CLEAN_VER\nArchitecture: $ARCH\nMaintainer: XRay-Addons Team\nDescription: XRayMan\nSection: utils\nPriority: optional" > "$DIR/DEBIAN/control"
          dpkg-deb --build "$DIR"
        done

    # 3. Добавляем собранные .deb пакеты в ваш созданный релиз
    - name: Upload DEB to Release
      uses: softprops/action-gh-release@v2
      with:
        files: "*.deb"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 4. Собираем ОДИН Docker-образ сразу под две архитектуры (Multi-Arch)
    - name: Set up QEMU and Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Multi-Arch Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./packaging/xray-nodeman.dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ github.ref_name }}
