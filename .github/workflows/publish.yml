name: Publish XRayMan

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache-dependency-path: |
            backend/node/go.sum
            backend/nodeman/go.sum

      - name: Install Go Tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.3.0
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      # XRay node: СБОРКА ОБЕИХ АРХИТЕКТУР ПО ОЧЕРЕДИ БЕЗ МАТРИЦЫ
      - name: Node Build Project
        run: |
          # Сборка amd64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 VERSION=${{ github.ref_name }} COMMIT=${{ github.sha }} BUILD_TIME=${{ github.event.head_commit.timestamp }} make build_node
          mkdir -p ./dist/amd64 && cp -r ./build/amd64/xray-node/ ./dist/amd64/xray-node

          # Сборка arm64 
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 VERSION=${{ github.ref_name }} COMMIT=${{ github.sha }} BUILD_TIME=${{ github.event.head_commit.timestamp }} make build_node
          mkdir -p ./dist/arm64 && cp -r ./build/arm64/xray-node/ ./dist/arm64/xray-node

      # XRay node: СОБИРАЕМ ДВА .DEB ПАКЕТА ЗА ОДИН ПРОХОД
      - name: Node Pack DEB Packages
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          CLEAN_VER=$(echo '${{ github.ref_name }}' | sed 's/^v//')
          ./packaging/xray-node/deb/build.sh "$CLEAN_VER" ./dist

      # XRay node man: СБОРКА ОБЕИХ АРХИТЕКТУР ПО ОЧЕРЕДИ БЕЗ МАТРИЦЫ
      - name: Nodeman Build Project
        run: |
          # Сборка amd64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 VERSION=${{ github.ref_name }} COMMIT=${{ github.sha }} BUILD_TIME=${{ github.event.head_commit.timestamp }} make build_nodeman
          mkdir -p ./dist/amd64 && cp -r ./build/amd64/xray-nodeman/ ./dist/amd64/xray-nodeman

          # Сборка arm64 
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 VERSION=${{ github.ref_name }} COMMIT=${{ github.sha }} BUILD_TIME=${{ github.event.head_commit.timestamp }} make build_nodeman
          mkdir -p ./dist/arm64 && cp -r ./build/arm64/xray-nodeman/ ./dist/arm64/xray-nodeman

      # XRay node: СОБИРАЕМ ДВА .DEB ПАКЕТА ЗА ОДИН ПРОХОД
      - name: Nodeman Pack DEB Packages
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          CLEAN_VER=$(echo '${{ github.ref_name }}' | sed 's/^v//')
          ./packaging/xray-nodeman/deb/build.sh "$CLEAN_VER" ./dist

      # ГЕНЕРИРУЕМ АКТУАЛЬНЫЕ DOCKER COMPOSE ФАЙЛЫ
      - name: Prepare Docker Compose Manifests
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          CLEAN_VER=$(echo '${{ github.ref_name }}' | sed 's/^v//')

          # 1. Создаем целевые папки (без этого sed упадет с ошибкой)
          mkdir -p ./dist/docker
          mkdir -p ./dist/docker/xray-nodeman
          mkdir -p ./dist/docker/xray-nodeman/all-in-one
          mkdir -p ./dist/docker/xray-nodeman/standalone
          mkdir -p ./dist/docker/xray-node

          # 2. Заменяем плейсхолдер версии на реальный тег релиза
          sed "s/VERSION_PLACEHOLDER/$CLEAN_VER/g" ./packaging/xray-nodeman/docker/all-in-one/docker-compose.yml > ./dist/docker/xray-nodeman/all-in-one/docker-compose.yml
          sed "s/VERSION_PLACEHOLDER/$CLEAN_VER/g" ./packaging/xray-nodeman/docker/standalone/docker-compose.yml > ./dist/docker/xray-nodeman/standalone/docker-compose.yml
          sed "s/VERSION_PLACEHOLDER/$CLEAN_VER/g" ./packaging/xray-node/docker/docker-compose.yml > ./dist/docker/xray-node/docker-compose.yml

          # 3. (Опционально) Скопируйте сюда дополнительные файлы конфигурации, если они есть
          cp ./packaging/xray-nodeman/docker/all-in-one/datasource.yml ./dist/docker/xray-nodeman/all-in-one/datasource.yml
          cp ./packaging/xray-nodeman/docker/all-in-one/prometheus.yml ./dist/docker/xray-nodeman/all-in-one/prometheus.yml
          cp -r ./packaging/xray-node/config ./dist/docker/xray-node/config

          # 4. Архиривуем папки (флаг -C временно меняет директорию, чтобы внутри архива не было лишней вложенности)
          tar -czf docker-compose.xray-nodeman.all-in-one.tar.gz -C ./dist/docker/xray-nodeman/all-in-one .
          tar -czf docker-compose.xray-nodeman.standalone.tar.gz -C ./dist/docker/xray-nodeman/standalone .
          tar -czf docker-compose.xray-node.tar.gz -C ./dist/docker/xray-node .

      # ПУБЛИКУЕМ ВСЕ АССЕТЫ В РЕЛИЗ (DEB + DOCKER COMPOSE)
      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            xray-nodeman-*.deb
            xray-node-*.deb
            docker-compose.xray-nodeman.all-in-one.tar.gz
            docker-compose.xray-nodeman.standalone.tar.gz
            docker-compose.xray-node.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # СБОРКА ОДНОГО МУЛЬТИПЛАТФОРМЕННОГО ОБРАЗА XRAY-NODEMAN
      - name: Push Multi-Arch XRay-NodeMan Docker Image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE_NAME=$(echo "${{ github.repository_owner }}/xray-nodeman" | tr '[:upper:]' '[:lower:]')
          CLEAN_VER=$(echo '${{ github.ref_name }}' | sed 's/^v//')

          # Включаем эмуляцию QEMU для сборки под ARM прямо на машине Intel
          docker run --privileged --rm tonistiigi/binfmt --install all
          docker buildx create --use

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f ./packaging/xray-nodeman/docker/xray-nodeman.dockerfile \
            -t ghcr.io/${IMAGE_NAME}:latest -t ghcr.io/${IMAGE_NAME}:${CLEAN_VER} \
            --push .

      # СБОРКА ОДНОГО МУЛЬТИПЛАТФОРМЕННОГО ОБРАЗА XRAY-NODE
      - name: Push Multi-Arch XRay-Node Docker Image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE_NAME=$(echo "${{ github.repository_owner }}/xray-node" | tr '[:upper:]' '[:lower:]')
          CLEAN_VER=$(echo '${{ github.ref_name }}' | sed 's/^v//')

          # Включаем эмуляцию QEMU для сборки под ARM прямо на машине Intel
          docker run --privileged --rm tonistiigi/binfmt --install all
          docker buildx create --use

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f ./packaging/xray-node/docker/xray-node.dockerfile \
            -t ghcr.io/${IMAGE_NAME}:latest -t ghcr.io/${IMAGE_NAME}:${CLEAN_VER} \
            --push .
