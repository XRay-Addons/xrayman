name: Publish XRayMan

on:
  push:
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with: { submodules: recursive }

      - name: Set up Environment (Go, Node, pnpm)
        uses: actions/setup-go@v6
        with: { go-version: "1.26.2", cache-dependency-path: "backend/node/go.sum\nbackend/nodeman/go.sum" }
      - uses: pnpm/action-setup@v5
        with: { version: 10.33.2 }
      - uses: actions/setup-node@v5
        with: { node-version: 24.3.0, cache: "pnpm", cache-dependency-path: frontend/pnpm-lock.yaml }

      - name: Build Project
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          make build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      # 1. СБОРКА .DEB ПАКЕТА ОДНОЙ КОМАНДОЙ ЧЕРЕЗ FPM
      - name: Pack DEB Package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sudo gem install --no-document fpm
          CLEAN_VER=$(echo '${{ github.ref_name }}' | sed 's/^v//')
          fpm -s dir -t deb -n xray-nodeman -v "$CLEAN_VER" -a ${{ matrix.goarch }} \
            --maintainer "XRay-Addons Team <admin@example.com>" \
            --description "XRayMan Node Manager Service" \
            --post-install ./packaging/xray-nodeman.postinstall.sh \
            --pre-uninstall ./packaging/xray-nodeman.prerm.sh \
            ./build/xray-nodeman/xray-nodeman=/usr/bin/xray-nodeman \
            ./packaging/xray-nodeman.service=/lib/systemd/system/xray-nodeman.service

      # 2. ПУБЛИКАЦИЯ ПАКЕТА В GITHUB RELEASES
      - name: Upload DEB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }

      # 3. АВТОРИЗАЦИЯ, СБОРКА И ОТПРАВКА DOCKER-ОБРАЗА В ОДИН ШАГ
      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }

      - name: Push Docker Image
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packaging/xray-nodeman.dockerfile
          push: true
          # Экшен сам автоматически переведет имя вашего репозитория в нижний регистр!
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.goarch }}
