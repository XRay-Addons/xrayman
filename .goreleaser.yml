version: 2
project_name: xrayman-nodeman

# Используем стандартный Go-билдер, но подменяем результат
builds:
  - id: xrayman-nodeman
    binary: xrayman-nodeman
    # Указываем на любой существующий файл, например на сам этот конфиг,
    # но флагами заставим Go собрать пустую строку
    main: .goreleaser.yml
    goos:
      - linux
    goarch:
      - amd64
      - arm64

    # Переопределяем флаги компиляции Go, чтобы он не ругался на отсутствие кода,
    # а просто создал бинарник-пустышку
    flags:
      - -buildmode=exe
    ldflags:
      - -w -s

    # Сразу после создания "пустышки" подменяем её вашим настоящим бинарником
    hooks:
      post:
        - cp ./dist-binaries/{{ .Arch }}/xrayman-nodeman {{ .Path }}

# Сборка .deb пакетов
nfpms:
  - id: xrayman-deb
    package_name: xrayman-nodeman
    formats:
      - deb
    vendor: "XRay-Addons"
    homepage: "https://github.com"
    maintainer: "XRay-Addons Team"
    description: "XRayMan Node Manager Service"
    license: "MIT"

    # Файлы внутри .deb пакета
    contents:
      - src: ./dist-binaries/{{ .Arch }}/xrayman-nodeman
        dst: /usr/bin/xrayman-nodeman
        file_info:
          mode: 0755
      - src: ./scripts/xrayman-nodeman.service
        dst: /lib/systemd/system/xrayman-nodeman.service
        file_info:
          mode: 0644

    # Скрипты управления systemd
    scripts:
      postinstall: ./scripts/postinstall.sh
      preremove: ./scripts/prerm.sh

# Сборка Docker-образов
dockers:
  - image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY }}:latest"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY }}:{{ .Version }}"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/{{ .Arch }}"
