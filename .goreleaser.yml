version: 2
project_name: xrayman-nodeman

# Используем стандартный блок сборки, но обманываем его, подкладывая готовые файлы
builds:
  - id: xrayman-nodeman
    binary: xrayman-nodeman
    # Используем любой минимальный go-файл, чтобы GoReleaser запустил процесс (можно указать '.', он не скомпилируется из-за no_unique_id или пустых флагов)
    main: .
    goos:
      - linux
    goarch:
      - amd64
      - arm64

    # Говорим GoReleaser ничего не компилировать (просто подменяем команду компиляции на пустую)
    builder: custom
    custom:
      command: "echo 'Skipping compilation, using pre-built binary'"

    # Как только "пустая" сборка завершена, хук копирует ваш готовый бинарник в папку, где его ждет GoReleaser
    hooks:
      post:
        - cp ./dist-binaries/{{ .Arch }}/xrayman-nodeman {{ .Path }}

# Сборка .deb пакетов
nfpms:
  - id: xrayman-deb
    package_name: xrayman-nodeman
    formats:
      - deb
    vendor: "XRay-Addons"
    homepage: "https://github.com"
    maintainer: "XRay-Addons Team"
    description: "XRayMan Node Manager Service"
    license: "MIT"

    # Файлы внутри .deb пакета
    contents:
      - src: ./dist-binaries/{{ .Arch }}/xrayman-nodeman
        dst: /usr/bin/xrayman-nodeman
        file_info:
          mode: 0755
      - src: ./scripts/xrayman-nodeman.service
        dst: /lib/systemd/system/xrayman-nodeman.service
        file_info:
          mode: 0644

    # Исправленное имя поля скрипта удаления
    scripts:
      postinstall: ./scripts/postinstall.sh
      pre_remove: ./scripts/prerm.sh

# Сборка Docker-образов
dockers:
  - image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY }}:latest"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY }}:{{ .Version }}"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/{{ .Arch }}"
