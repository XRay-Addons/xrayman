version: 2
project_name: xrayman-nodeman

# Кастомная сборка-заглушка под бесплатную версию
builds:
  - id: xrayman-nodeman
    binary: xrayman-nodeman
    main: .
    goos:
      - linux
    goarch:
      - amd64
      - arm64

    # Правильный синтаксис кастомного сборщика для v2 без лишней вложенности
    builder: custom
    command: "echo 'Skipping compilation, using pre-built binary'"

    # Копируем готовый бинарник в целевую папку билда
    hooks:
      post:
        - cp ./dist-binaries/{{ .Arch }}/xrayman-nodeman {{ .Path }}

# Сборка .deb пакетов
nfpms:
  - id: xrayman-deb
    package_name: xrayman-nodeman
    formats:
      - deb
    vendor: "XRay-Addons"
    homepage: "https://github.com"
    maintainer: "XRay-Addons Team"
    description: "XRayMan Node Manager Service"
    license: "MIT"

    # Файлы внутри .deb пакета
    contents:
      - src: ./dist-binaries/{{ .Arch }}/xrayman-nodeman
        dst: /usr/bin/xrayman-nodeman
        file_info:
          mode: 0755
      - src: ./scripts/xrayman-nodeman.service
        dst: /lib/systemd/system/xrayman-nodeman.service
        file_info:
          mode: 0644

    # Скрипты управления systemd
    scripts:
      postinstall: ./scripts/postinstall.sh
      preremove: ./scripts/prerm.sh

# Сборка Docker-образов
dockers:
  - image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY }}:latest"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY }}:{{ .Version }}"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/{{ .Arch }}"
