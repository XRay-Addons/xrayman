services:
  xray-nodeman:
    image: ghcr.io/xray-addons/xray-nodeman:v0.2.14-28
    container_name: xray-nodeman
    restart: unless-stopped
    ports:
      - "8080:80"
      - "9090:9090"
    environment:
      XRAY_NODEMAN_ENDPOINT: "localhost:80"
      XRAY_NODEMAN_METRICS_ENDPOINT: "localhost:9090"
      XRAY_NODEMAN_DB: ${XRAY_NODEMAN_DB:-MISSING}
      XRAY_NODEMAN_JWT: ${XRAY_NODEMAN_JWT:-MISSING}
