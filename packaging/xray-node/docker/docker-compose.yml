x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  xray-node:
    image: ghcr.io/xray-addons/xray-node:VERSION_PLACEHOLDER
    container_name: xray-node
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      XRAY_NODE_ENDPOINT: "0.0.0.0:5001"
      XRAY_NODE_DATA_DIR: "/usr/bin/xray-node/data"
      XRAY_NODE_CONFIG_DIR: "/xray-node-config"
      XRAY_NODE_PERSISTENT_DIR: "/xray-node-persistent"
    volumes:
      # Все пользовательские конфиги — только чтение
      - ./xray-node-config:/xray-node-config:ro

      # Эти файлы контейнер может менять/удалять
      # (там скрипт который выставляет ключи при первом запуске)
      - ./xray-node-config/xray_client.example.json:/xray-node-config/xray_client.example.json
      - ./xray-node-config/xray_server.example.json:/xray-node-config/xray_server.example.json
      - ./xray-node-config/xray_keygen.tmp.sh:/xray-node-config/xray_keygen.tmp.sh

      # Persistent state самого xray-node.
      # Обычный rw, поскольку приложение туда пишет.
      - ./xray-node-persistent:/xray-node-persistent
    <<: *default-logging
