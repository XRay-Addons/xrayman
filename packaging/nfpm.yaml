name: xrayman-nodeman
arch: ${ARCH}
platform: linux

version: ${VERSION}
release: ${RELEASE}

section: default
priority: optional

maintainer: XRayMan
description: XRayMan Node Manager
license: MIT

contents:
  - src: ./build/xray-nodeman
    dst: /usr/bin/xray-nodeman
    file_info:
      mode: 0755

  - src: ./packaging/xray-nodeman.service
    dst: /usr/lib/systemd/system/xray-nodeman.service
    file_info:
      mode: 0644

  - src: ./packaging/xray-nodeman.env.example
    dst: /etc/xrayman/xray-nodeman.env.example
    file_info:
      mode: 0644

scripts:
  postinstall: ./packaging/xray-nodeman.postinstall.sh
